<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Manrope:wght@800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <header class="topbar"><div class="brand"><span>+</span> calculate</div><button id="themeButton" class="theme-button" aria-label="Toggle dark mode">☼</button></header>
      <section class="display" aria-live="polite"><div id="expression" class="expression"></div><div id="display" class="display-value">0</div></section>
      <section class="keypad">
        <button class="key utility" data-action="clear">AC</button><button class="key utility" data-action="sign">+/-</button><button class="key utility" data-action="percent">%</button><button class="key operator" data-value="÷">÷</button>
        <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key operator" data-value="×">×</button>
        <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key operator" data-value="−">−</button>
        <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key operator" data-value="+">+</button>
        <button class="key zero" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key equals" data-action="equals">=</button>
      </section>
      <p class="hint">Tip: you can also use your keyboard</p>
    </main>
    <script src="app.js?v=4"></script>
  </body>
</html>
